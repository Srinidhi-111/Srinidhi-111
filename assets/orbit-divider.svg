<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="74" viewBox="0 0 1600 74" role="img" aria-label="Cosmic orbit divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity=".82"/>
      <stop offset="65%" stop-color="#F472B6" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dot { animation: orbit 4s linear infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes orbit {
        0% { transform: translateX(-100px); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(1700px); opacity: 0; }
      }
      @keyframes pulse {
        0%,100% { opacity: .4; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.4); }
      }
    </style>
  </defs>
  <rect width="1600" height="74" fill="#030712"/>
  <path d="M0 37 C300 2 520 70 800 37 C1080 4 1300 70 1600 37" fill="none" stroke="url(#line)" stroke-width="2"/>
  <circle class="pulse" cx="800" cy="37" r="6" fill="#EAF7FF" filter="url(#glow)"/>
  <circle class="dot" cx="0" cy="37" r="5" fill="#22D3EE" filter="url(#glow)"/>
</svg>
