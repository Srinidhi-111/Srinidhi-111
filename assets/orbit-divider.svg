<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="74" viewBox="0 0 1600 74" role="img" aria-label="Subtle cosmic orbit divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AAB3C5" stop-opacity="0"/>
      <stop offset="35%" stop-color="#AAB3C5" stop-opacity=".58"/>
      <stop offset="65%" stop-color="#737B98" stop-opacity=".58"/>
      <stop offset="100%" stop-color="#737B98" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .orbiter {
        animation: orbit 6s linear infinite;
      }

      .center {
        animation: pulse 3.4s ease-in-out infinite;
      }

      @keyframes orbit {
        0% {
          transform: translateX(-100px);
          opacity: 0;
        }

        12% {
          opacity: .72;
        }

        88% {
          opacity: .72;
        }

        100% {
          transform: translateX(1700px);
          opacity: 0;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: .38;
          transform: scale(.82);
        }

        50% {
          opacity: .82;
          transform: scale(1.22);
        }
      }
    </style>
  </defs>

  <rect width="1600" height="74" fill="#0B1020"/>

  <path d="M0 37 C300 2 520 70 800 37 C1080 4 1300 70 1600 37"
        fill="none"
        stroke="url(#line)"
        stroke-width="1.4"/>

  <circle class="center" cx="800" cy="37" r="4.2" fill="#DDE3EE" opacity=".78" filter="url(#glow)"/>
  <circle class="orbiter" cx="0" cy="37" r="3.2" fill="#C8D0DE" opacity=".70" filter="url(#glow)"/>
</svg>
