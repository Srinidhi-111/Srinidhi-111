      <stop offset="0" stop-color="#6FD3FF" stop-opacity="0"/><stop offset=".5" stop-color="#6FD3FF"/><stop offset="1" stop-color="#6FD3FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#E2EAF4" stop-opacity=".5"/><stop offset=".45" stop-color="#E2EAF4" stop-opacity=".16"/><stop offset="1" stop-color="#E2EAF4" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1600" height="300" rx="18"/></clipPath>
    <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(.8) } 50% { opacity:1; transform: scale(1.15) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .sun { transform-box: fill-box; transform-origin: center; animation: rise 8s ease-in-out infinite; }
      @keyframes rise { 0%,100% { opacity:.7; transform: scale(.92) } 50% { opacity:1; transform: scale(1.08) } }
    </style>
  </defs>
