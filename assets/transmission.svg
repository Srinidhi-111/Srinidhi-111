<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="250" viewBox="0 0 1600 250" role="img" aria-label="Deep-space final transmission">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#11123A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .beam { animation: beam 3.6s ease-in-out infinite; transform-origin: center; }
      .star { animation: star 2.5s ease-in-out infinite; }
      .s2 { animation-delay: .8s; }
      .s3 { animation-delay: 1.6s; }
      @keyframes beam {
        0%,100% { opacity: .18; transform: scaleX(.7); }
        50% { opacity: .85; transform: scaleX(1.15); }
      }
      @keyframes star {
        0%,100% { opacity: .2; transform: scale(.7); }
        50% { opacity: 1; transform: scale(1.5); }
      }
    </style>
  </defs>

  <rect width="1600" height="250" rx="18" fill="url(#bg)"/>

  <g fill="#EAF7FF">
    <circle class="star" cx="155" cy="70" r="2"/>
    <circle class="star s2" cx="310" cy="158" r="1.4"/>
    <circle class="star s3" cx="468" cy="58" r="1.8"/>
    <circle class="star" cx="1134" cy="62" r="1.8"/>
    <circle class="star s2" cx="1297" cy="167" r="1.4"/>
    <circle class="star s3" cx="1468" cy="76" r="2"/>
  </g>

  <path class="beam" d="M150 125 C480 55 720 195 800 125 C880 55 1120 195 1450 125" fill="none" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
  <circle cx="800" cy="125" r="15" fill="#8B5CF6" opacity=".7" filter="url(#glow)"/>
  <circle cx="800" cy="125" r="6" fill="#EAF7FF"/>

  <text x="800" y="82" text-anchor="middle" font-family="Courier New, monospace" font-size="15" letter-spacing="5" fill="#22D3EE">
    TRANSMISSION COMPLETE
  </text>
  <text x="800" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#EAF7FF">
    BUILD WITH CURIOSITY. SHIP WITH PURPOSE. KEEP LOOKING UP.
  </text>

  <rect x="1" y="1" width="1598" height="248" rx="18" fill="none" stroke="#8B5CF6" stroke-opacity=".35"/>
</svg>
