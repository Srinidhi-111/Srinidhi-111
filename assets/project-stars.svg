<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="180" viewBox="0 0 1600 180" role="img" aria-label="Subtle constellation stars">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#11162A"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .star {
        fill: #E8EDF7;
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 4.5s ease-in-out infinite;
      }

      .slow {
        animation-delay: 1.3s;
      }

      .slower {
        animation-delay: 2.6s;
      }

      .line {
        fill: none;
        stroke: #AAB3C5;
        stroke-width: 1;
        stroke-opacity: .25;
        stroke-dasharray: 2 8;
        animation: trace 20s linear infinite;
      }

      @keyframes twinkle {
        0%, 100% {
          opacity: .24;
          transform: scale(.74);
        }

        50% {
          opacity: .95;
          transform: scale(1.3);
        }
      }

      @keyframes trace {
        to {
          stroke-dashoffset: -220;
        }
      }
    </style>
  </defs>

  <rect width="1600" height="180" rx="16" fill="url(#background)"/>

  <path class="line" d="M260 110 L430 55 L615 112 L800 46 L1008 111 L1215 60 L1380 109"/>

  <g>
    <circle class="star" cx="260" cy="110" r="3.2" filter="url(#glow)"/>
    <circle class="star slow" cx="430" cy="55" r="3.6" filter="url(#glow)"/>
    <circle class="star slower" cx="615" cy="112" r="3.1" filter="url(#glow)"/>
    <circle class="star" cx="800" cy="46" r="4.2" filter="url(#glow)"/>
    <circle class="star slow" cx="1008" cy="111" r="3.3" filter="url(#glow)"/>
    <circle class="star slower" cx="1215" cy="60" r="3.6" filter="url(#glow)"/>
    <circle class="star" cx="1380" cy="109" r="3.1" filter="url(#glow)"/>
  </g>

  <text x="800"
        y="154"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18"
        letter-spacing="4"
        fill="#B8C1D3">
    SELECTED WORK
  </text>

  <rect x="1" y="1" width="1598" height="178" rx="16" fill="none" stroke="#AAB3C5" stroke-opacity=".12"/>
</svg>
