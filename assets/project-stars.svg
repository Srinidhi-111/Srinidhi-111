      .draw { stroke-dasharray: 1119; stroke-dashoffset: 1119; animation: draw 2.6s cubic-bezier(.4,0,.2,1) .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .flow { stroke-dasharray: 2 10; animation: flow 14s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -240 } }
      .lab { animation: fade 1s ease-out both; }
      @keyframes fade { from { opacity:0 } to { opacity:1 } }
    </style>
