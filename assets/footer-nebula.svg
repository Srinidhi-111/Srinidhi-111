<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="230" viewBox="0 0 1600 230" role="img" aria-label="Quiet deep space footer">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#15172D"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>

    <radialGradient id="nebula" cx="50%" cy="20%" r="62%">
      <stop offset="0%" stop-color="#9AA3B7" stop-opacity=".12"/>
      <stop offset="52%" stop-color="#66708F" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#060914" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .star {
        fill: #E8EDF7;
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 5s ease-in-out infinite;
      }

      .slow {
        animation-delay: 1.5s;
      }

      .slower {
        animation-delay: 2.8s;
      }

      @keyframes twinkle {
        0%, 100% {
          opacity: .20;
          transform: scale(.72);
        }

        50% {
          opacity: .95;
          transform: scale(1.28);
        }
      }
    </style>
  </defs>

  <rect width="1600" height="230" rx="18" fill="url(#background)"/>
  <rect width="1600" height="230" rx="18" fill="url(#nebula)"/>

  <g>
    <circle class="star" cx="146" cy="72" r="1.8"/>
    <circle class="star slow" cx="308" cy="154" r="1.3"/>
    <circle class="star slower" cx="468" cy="60" r="1.8"/>
    <circle class="star" cx="637" cy="164" r="1.2"/>
    <circle class="star slow" cx="809" cy="50" r="2.1"/>
    <circle class="star slower" cx="982" cy="157" r="1.4"/>
    <circle class="star" cx="1140" cy="67" r="1.7"/>
    <circle class="star slow" cx="1305" cy="161" r="1.2"/>
    <circle class="star slower" cx="1457" cy="73" r="1.8"/>
  </g>

  <circle cx="800" cy="113" r="30" fill="#B8C1D3" opacity=".04" filter="url(#glow)"/>
  <circle cx="800" cy="113" r="6" fill="#E8EDF7" opacity=".78" filter="url(#glow)"/>

  <text x="800"
        y="166"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20"
        letter-spacing="1.5"
        fill="#D8DEE9">
    Still learning. Still building. Still looking ahead.
  </text>

  <rect x="1" y="1" width="1598" height="228" rx="18" fill="none" stroke="#AAB3C5" stroke-opacity=".12"/>
</svg>
