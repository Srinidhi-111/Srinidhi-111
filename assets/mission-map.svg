<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Developer Mission Constellation</title>
  <desc id="desc">A constellation map connecting full-stack engineering, backend systems, real-time analytics, applied AI, cloud deployment, and human-centered design.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#121042"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .node { filter: url(#glow); }
      .line { stroke: #6D5DFB; stroke-width: 1.8; stroke-opacity: .55; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
      .p2 { animation-delay: .8s; }
      .p3 { animation-delay: 1.5s; }
      .p4 { animation-delay: 2.1s; }
      .dash { stroke-dasharray: 8 12; animation: dash 12s linear infinite; }
      .star { animation: blink 2s ease-in-out infinite; }
      .s2 { animation-delay: .9s; }
      .s3 { animation-delay: 1.5s; }

      @keyframes pulse {
        0%, 100% { opacity: .6; transform: scale(.86); }
        50% { opacity: 1; transform: scale(1.22); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes blink {
        0%, 100% { opacity: .24; }
        50% { opacity: .95; }
      }
    </style>
  </defs>

  <rect width="1600" height="420" rx="18" fill="url(#bg)"/>
  <g fill="#EAF7FF" opacity=".55">
    <circle class="star" cx="66" cy="55" r="1.4"/>
    <circle class="star s2" cx="195" cy="98" r="1.2"/>
    <circle class="star s3" cx="322" cy="55" r="1.5"/>
    <circle class="star" cx="486" cy="114" r="1.1"/>
    <circle class="star s2" cx="667" cy="61" r="1.4"/>
    <circle class="star s3" cx="809" cy="92" r="1.2"/>
    <circle class="star" cx="1004" cy="57" r="1.5"/>
    <circle class="star s2" cx="1198" cy="95" r="1.1"/>
    <circle class="star s3" cx="1430" cy="51" r="1.4"/>
    <circle class="star" cx="1510" cy="350" r="1.2"/>
    <circle class="star s2" cx="93" cy="364" r="1.2"/>
  </g>

  <g class="dash line" fill="none">
    <path d="M242 208 L519 115 L794 209 L1073 112 L1354 210"/>
    <path d="M519 115 L648 325 L794 209 L934 327 L1073 112"/>
    <path d="M242 208 L648 325 L934 327 L1354 210"/>
  </g>

  <g font-family="Courier New, monospace">
    <text x="800" y="43" text-anchor="middle" font-size="18" letter-spacing="5" fill="#22D3EE">
      CONSTELLATION // ENGINEERING ORBIT
    </text>

    <g transform="translate(242 208)">
      <circle class="pulse node" r="25" fill="#22D3EE"/>
      <circle r="11" fill="#EAF7FF"/>
      <text y="58" text-anchor="middle" font-size="16" fill="#EAF7FF">FULL-STACK</text>
      <text y="82" text-anchor="middle" font-size="13" fill="#94A3B8">React • TypeScript</text>
    </g>

    <g transform="translate(519 115)">
      <circle class="pulse p2 node" r="25" fill="#F472B6"/>
      <circle r="11" fill="#EAF7FF"/>
      <text y="-45" text-anchor="middle" font-size="16" fill="#EAF7FF">BACKEND</text>
      <text y="-21" text-anchor="middle" font-size="13" fill="#94A3B8">FastAPI • APIs</text>
    </g>

    <g transform="translate(794 209)">
      <circle class="pulse p3 node" r="31" fill="#8B5CF6"/>
      <circle r="14" fill="#EAF7FF"/>
      <text y="64" text-anchor="middle" font-size="17" fill="#EAF7FF">REAL-TIME</text>
      <text y="88" text-anchor="middle" font-size="13" fill="#94A3B8">WebSockets • Events</text>
    </g>

    <g transform="translate(1073 112)">
      <circle class="pulse p4 node" r="25" fill="#22D3EE"/>
      <circle r="11" fill="#EAF7FF"/>
      <text y="-45" text-anchor="middle" font-size="16" fill="#EAF7FF">APPLIED AI</text>
      <text y="-21" text-anchor="middle" font-size="13" fill="#94A3B8">NLP • LLM APIs</text>
    </g>

    <g transform="translate(1354 210)">
      <circle class="pulse p2 node" r="25" fill="#F472B6"/>
      <circle r="11" fill="#EAF7FF"/>
      <text y="58" text-anchor="middle" font-size="16" fill="#EAF7FF">CLOUD</text>
      <text y="82" text-anchor="middle" font-size="13" fill="#94A3B8">Deploy • Monitor</text>
    </g>

    <g transform="translate(648 325)">
      <circle class="pulse p4 node" r="21" fill="#8B5CF6"/>
      <circle r="9" fill="#EAF7FF"/>
      <text y="52" text-anchor="middle" font-size="15" fill="#EAF7FF">DATA</text>
      <text y="74" text-anchor="middle" font-size="12" fill="#94A3B8">PostgreSQL</text>
    </g>

    <g transform="translate(934 327)">
      <circle class="pulse p3 node" r="21" fill="#22D3EE"/>
      <circle r="9" fill="#EAF7FF"/>
      <text y="52" text-anchor="middle" font-size="15" fill="#EAF7FF">UX</text>
      <text y="74" text-anchor="middle" font-size="12" fill="#94A3B8">Human Signals</text>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="418" rx="18" fill="none" stroke="#22D3EE" stroke-opacity=".18"/>
</svg>
