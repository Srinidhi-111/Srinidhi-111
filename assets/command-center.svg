<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Srinidhi R Deep Space Developer Command Center</title>
  <desc id="desc">An animated deep-space banner with stars, orbit rings, a planet, and developer identity information.</desc>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="42%" stop-color="#071226"/>
      <stop offset="72%" stop-color="#1B1643"/>
      <stop offset="100%" stop-color="#070A1A"/>
    </linearGradient>

    <radialGradient id="nebula" cx="72%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".48"/>
      <stop offset="45%" stop-color="#312E81" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planet" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#EAF7FF"/>
      <stop offset="15%" stop-color="#67E8F9"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="78%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0A0D24"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="42%" stop-color="#22D3EE" stop-opacity=".72"/>
      <stop offset="72%" stop-color="#F472B6" stop-opacity=".76"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38BDF8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .display { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: 9px; }
      .star { fill: #EAF7FF; }
      .tiny { fill: #BAE6FD; opacity: .64; }
      .scan { animation: scan 5s linear infinite; }
      .orbit { transform-origin: 1220px 265px; animation: rotate 18s linear infinite; }
      .orbit2 { transform-origin: 1220px 265px; animation: rotateReverse 27s linear infinite; }
      .planetPulse { animation: planetPulse 5s ease-in-out infinite; transform-origin: 1220px 265px; }
      .signal { animation: signal 2.6s ease-in-out infinite; }
      .st1 { animation: twinkle 2.4s ease-in-out infinite; }
      .st2 { animation: twinkle 3.3s ease-in-out infinite .8s; }
      .st3 { animation: twinkle 4s ease-in-out infinite 1.4s; }
      .cursor { animation: blink .9s step-end infinite; }

      @keyframes twinkle {
        0%, 100% { opacity: .18; transform: scale(.75); }
        50% { opacity: 1; transform: scale(1.45); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes planetPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #22D3EE); }
        50% { filter: drop-shadow(0 0 18px #8B5CF6); }
      }
      @keyframes scan {
        0% { transform: translateY(-100px); opacity: 0; }
        10% { opacity: .18; }
        90% { opacity: .18; }
        100% { transform: translateY(560px); opacity: 0; }
      }
      @keyframes signal {
        0%, 100% { opacity: .38; transform: scale(.92); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1600" height="520" fill="url(#space)"/>
  <rect width="1600" height="520" fill="url(#nebula)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <g class="star">
    <circle class="st1" cx="83" cy="74" r="2"/>
    <circle class="st2" cx="154" cy="192" r="1.4"/>
    <circle class="st3" cx="265" cy="58" r="1.7"/>
    <circle class="st1" cx="370" cy="136" r="1.3"/>
    <circle class="st2" cx="474" cy="87" r="2.2"/>
    <circle class="st3" cx="562" cy="216" r="1.2"/>
    <circle class="st1" cx="672" cy="72" r="1.6"/>
    <circle class="st2" cx="764" cy="155" r="1.2"/>
    <circle class="st3" cx="870" cy="60" r="2"/>
    <circle class="st1" cx="1020" cy="105" r="1.2"/>
    <circle class="st2" cx="1457" cy="86" r="1.8"/>
    <circle class="st3" cx="1508" cy="211" r="1.2"/>
    <circle class="st1" cx="1415" cy="410" r="1.6"/>
    <circle class="st2" cx="962" cy="448" r="1.2"/>
    <circle class="st3" cx="680" cy="425" r="1.5"/>
    <circle class="st1" cx="410" cy="451" r="1.8"/>
    <circle class="st2" cx="116" cy="405" r="1.4"/>
  </g>

  <g class="tiny">
    <circle cx="38" cy="301" r="1"/>
    <circle cx="205" cy="322" r="1"/>
    <circle cx="328" cy="271" r="1"/>
    <circle cx="444" cy="364" r="1"/>
    <circle cx="598" cy="329" r="1"/>
    <circle cx="746" cy="401" r="1"/>
    <circle cx="888" cy="295" r="1"/>
    <circle cx="1090" cy="425" r="1"/>
    <circle cx="1340" cy="337" r="1"/>
    <circle cx="1545" cy="363" r="1"/>
  </g>

  <g opacity=".65" stroke="#22D3EE" fill="none">
    <path d="M78 382 L178 320 L285 360 L404 290 L512 335" stroke-width="1.1"/>
    <path d="M78 382 L178 320 L285 360 L404 290 L512 335" stroke-opacity=".25" stroke-width="7"/>
    <circle cx="78" cy="382" r="3" fill="#22D3EE" filter="url(#glowCyan)"/>
    <circle cx="178" cy="320" r="3" fill="#22D3EE" filter="url(#glowCyan)"/>
    <circle cx="285" cy="360" r="3" fill="#F472B6" filter="url(#glowViolet)"/>
    <circle cx="404" cy="290" r="3" fill="#22D3EE" filter="url(#glowCyan)"/>
    <circle cx="512" cy="335" r="3" fill="#F472B6" filter="url(#glowViolet)"/>
  </g>

  <g class="planetPulse">
    <circle cx="1220" cy="265" r="113" fill="#22D3EE" opacity=".08" filter="url(#glowCyan)"/>
    <circle cx="1220" cy="265" r="87" fill="url(#planet)"/>
    <path d="M1152 260 C1187 216 1263 211 1300 242 C1275 230 1238 232 1207 254 C1184 270 1172 291 1162 312 C1142 295 1140 276 1152 260Z" fill="#0F172A" opacity=".28"/>
    <path d="M1165 313 C1203 285 1266 289 1293 314 C1262 307 1226 320 1198 344 C1177 337 1169 327 1165 313Z" fill="#020617" opacity=".28"/>
    <circle cx="1193" cy="228" r="11" fill="#EAF7FF" opacity=".22"/>
  </g>

  <g class="orbit">
    <ellipse cx="1220" cy="265" rx="174" ry="51" fill="none" stroke="url(#ring)" stroke-width="2"/>
    <circle cx="1383" cy="243" r="6" fill="#F472B6" filter="url(#glowViolet)"/>
  </g>
  <g class="orbit2">
    <ellipse cx="1220" cy="265" rx="138" ry="151" fill="none" stroke="#22D3EE" stroke-opacity=".42" stroke-width="1.4" transform="rotate(-28 1220 265)"/>
    <circle cx="1268" cy="127" r="4.5" fill="#22D3EE" filter="url(#glowCyan)"/>
  </g>

  <g class="scan">
    <rect x="0" y="0" width="1600" height="5" fill="#22D3EE" opacity=".25"/>
    <rect x="0" y="5" width="1600" height="18" fill="#22D3EE" opacity=".035"/>
  </g>

  <g transform="translate(98 152)">
    <text x="0" y="0" class="mono" font-size="16" fill="#22D3EE" letter-spacing="3">[ DEVELOPER COMMAND CENTER // ONLINE ]</text>

    <text x="0" y="82" class="display" font-size="68" fill="#EAF7FF">SRINIDHI R</text>

    <text x="4" y="128" class="mono" font-size="18" fill="#A5B4FC">
      FULL-STACK SYSTEMS  <tspan fill="#22D3EE">/</tspan>  REAL-TIME ANALYTICS  <tspan fill="#F472B6">/</tspan>  APPLIED AI
    </text>

    <line x1="0" y1="158" x2="670" y2="158" stroke="#22D3EE" stroke-opacity=".42"/>
    <circle class="signal" cx="0" cy="158" r="5" fill="#22D3EE" filter="url(#glowCyan)"/>

    <text x="0" y="204" class="mono" font-size="15" fill="#C4B5FD">MISSION:</text>
    <text x="88" y="204" class="mono" font-size="15" fill="#EAF7FF">BUILD SOFTWARE THAT OBSERVES, UNDERSTANDS, AND RESPONDS.</text>

    <text x="0" y="240" class="mono" font-size="14" fill="#94A3B8">STATUS:</text>
    <text x="76" y="240" class="mono" font-size="14" fill="#22D3EE">ACTIVE</text>
    <text x="152" y="240" class="mono" font-size="14" fill="#94A3B8">|</text>
    <text x="173" y="240" class="mono" font-size="14" fill="#F472B6">COIMBATORE, INDIA</text>
    <text x="354" y="240" class="mono" font-size="14" fill="#94A3B8">|</text>
    <text x="374" y="240" class="mono" font-size="14" fill="#EAF7FF">CSE STUDENT</text>

    <text x="0" y="292" class="mono" font-size="14" fill="#64748B">AWAITING NEXT TRANSMISSION</text>
    <text x="256" y="292" class="mono cursor" font-size="16" fill="#22D3EE">█</text>
  </g>

  <g transform="translate(1067 432)">
    <text class="mono" font-size="12" fill="#94A3B8" letter-spacing="2">ORBITAL NODE // 08.11.26</text>
  </g>

  <rect x="1" y="1" width="1598" height="518" fill="none" stroke="#22D3EE" stroke-opacity=".18" stroke-width="2"/>
</svg>
