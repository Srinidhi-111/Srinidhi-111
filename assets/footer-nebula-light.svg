<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="230" viewBox="0 0 1600 230" role="img" aria-label="Quiet light-theme footer">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#EEF2F7"/>
      <stop offset="100%" stop-color="#E6ECF4"/>
    </linearGradient>

    <radialGradient id="nebula" cx="50%" cy="20%" r="62%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity=".42"/>
      <stop offset="52%" stop-color="#D7DEE8" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .star {
        fill: #475569;
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 5s ease-in-out infinite;
      }

      .slow {
        animation-delay: 1.5s;
      }

      .slower {
        animation-delay: 2.8s;
      }

      @keyframes twinkle {
        0%, 100% {
          opacity: .20;
          transform: scale(.72);
        }

        50% {
          opacity: .85;
          transform: scale(1.28);
        }
      }
    </style>
  </defs>

  <rect width="1600" height="230" rx="18" fill="url(#background)"/>
  <rect width="1600" height="230" rx="18" fill="url(#nebula)"/>

  <g>
    <circle class="star" cx="146" cy="72" r="1.8"/>
    <circle class="star slow" cx="308" cy="154" r="1.3"/>
    <circle class="star slower" cx="468" cy="60" r="1.8"/>
    <circle class="star" cx="637" cy="164" r="1.2"/>
    <circle class="star slow" cx="809" cy="50" r="2.1"/>
    <circle class="star slower" cx="982" cy="157" r="1.4"/>
    <circle class="star" cx="1140" cy="67" r="1.7"/>
    <circle class="star slow" cx="1305" cy="161" r="1.2"/>
    <circle class="star slower" cx="1457" cy="73" r="1.8"/>
  </g>

  <circle cx="800" cy="113" r="30" fill="#94A3B8" opacity=".14" filter="url(#glow)"/>
  <circle cx="800" cy="113" r="6" fill="#475569" opacity=".72" filter="url(#glow)"/>

  <text x="800"
        y="166"
        text-anchor="middle"
        font-family="Georgia, Times New Roman, serif"
        font-size="20"
        letter-spacing="1.5"
        fill="#334155">
    Still learning. Still building. Still looking ahead.
  </text>

  <rect x="1" y="1" width="1598" height="228" rx="18" fill="none" stroke="#94A3B8" stroke-opacity=".36"/>
</svg>
