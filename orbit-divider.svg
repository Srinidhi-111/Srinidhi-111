<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="70" viewBox="0 0 1600 70" role="img" aria-label="A comet crossing a thin orbit line">
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="midblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AFC0E8" stop-opacity="0"/><stop offset=".5" stop-color="#AFC0E8" stop-opacity=".45"/><stop offset="1" stop-color="#AFC0E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2CF7A" stop-opacity="0"/><stop offset="1" stop-color="#F2CF7A" stop-opacity=".9"/>
    </linearGradient>
    <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(.8) } 50% { opacity:1; transform: scale(1.15) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .comet { animation: comet 7s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes comet { 0% { transform: translateX(-220px); opacity:0 } 8% { opacity:1 } 92% { opacity:1 } 100% { transform: translateX(1640px); opacity:0 } }
    </style>
  </defs>
  <path d="M0 35 Q800 18 1600 35" fill="none" stroke="url(#fadeLine)" stroke-width="1.2"/>
  <circle cx="996.6" cy="51.9" r="1.0" fill="#FFFFFF" opacity="0.57"/>
<circle cx="1043.3" cy="37.1" r="1.0" fill="#FFFFFF" opacity="0.48"/>
