  <g transform="translate(800 22)"><path d="M-7 0L0 -7L7 0L0 7Z" fill="#F2CF7A" opacity=".85"/></g>
  <g class="comet"><path d="M-170 33 Q-80 25 0 27" fill="none" stroke="url(#tail)" stroke-width="2.2" stroke-linecap="round"/><circle cx="0" cy="27" r="3.2" fill="#F2CF7A" filter="url(#glow)"/></g>
</svg>
